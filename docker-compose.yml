services:
  db-user:
    image: postgres:15
    container_name: db-user
    restart: unless-stopped
    env_file:
      - ./services/user-service/.env
    ports:
      - "5432:5432"
    volumes:
      - db-user-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U avigo_user || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  db-notification:
    image: postgres:15
    container_name: db-notification
    restart: unless-stopped
    env_file:
      - ./services/notification-service/.env
    ports:
      - "5433:5432"
    volumes:
      - db-notification-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U avigo_notifications || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  db-listing:
    image: postgres:15
    container_name: db-listing
    restart: unless-stopped
    env_file:
      - ./services/listing-service/.env
    ports:
      - "5434:5432"
    volumes:
      - db-listing-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U avigo_listings -d avigo_listings" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongo-listing:
    image: mongo:7.0
    container_name: mongo-listing
    restart: unless-stopped
    command: ["--quiet"]
    env_file:
      - ./services/listing-service/.env
    ports:
      - "27017:27017"
    volumes:
      - mongodb-listing-data:/data/db
      - mongodb-listing-config:/data/configdb
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "127.0.0.1/test", "--eval", "quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9002:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  gateway-service:
    build:
      context: ./services/gateway-service
      dockerfile: Dockerfile
    container_name: gateway-service
    env_file:
      - ./services/gateway-service/.env
    ports:
      - "8080:8080"

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: user-service
    depends_on:
      db-user:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      - ./services/user-service/.env
    ports:
      - "8081:8081"

  listing-service:
    build:
      context: ./services/listing-service
      dockerfile: Dockerfile
    container_name: listing-service
    depends_on:
      db-listing:
        condition: service_healthy
      mongo-listing:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    env_file:
      - ./services/listing-service/.env
    ports:
      - "8082:8082"

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    depends_on:
      db-notification:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      - ./services/notification-service/.env
    ports:
      - "8087:8087"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    healthcheck:
      test: [ "CMD-SHELL", "echo srvr | nc localhost 2181 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8080/api/v1
    depends_on:
      - gateway-service
    restart: unless-stopped

volumes:
  db-user-data:
  db-notification-data:
  db-listing-data:
  mongodb-listing-data:
  mongodb-listing-config:
  minio-data:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  es-data: