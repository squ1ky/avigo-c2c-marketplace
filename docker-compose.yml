services:
  db-user:
    image: postgres:15
    restart: always
    env_file:
      - ./services/user-service/.env
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    depends_on:
      - db-user
    env_file:
      - ./services/user-service/.env
    ports:
      - "8081:8081"

volumes:
  db-data:
